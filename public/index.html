<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BinFinder · LASU Epe</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.min.css">
  <link rel="stylesheet" href="vendor/leaflet/MarkerCluster.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="student">
  <header class="topbar">
    <div>
      <div class="brand">🗑️ BinFinder</div>
      <div class="sub">LASU Epe Campus</div>
    </div>
    <!-- No link to /admin: the dashboard is for the team, reachable by typing the URL. -->
  </header>

  <div id="map"></div>

  <!-- The whole home screen answers one question: where is the nearest bin I can
       use, and how far is it. Everything else is one tap below that answer. -->
  <section class="sheet">
    <div id="answer">
      <div class="answer-card loading">
        <div class="spin"></div>
        <div><b>Finding your location…</b><div class="small muted">Allow location so we can show the nearest bin.</div></div>
      </div>
    </div>

    <details class="legend-box">
      <summary>What the pins mean</summary>
      <div class="legend">
        <span><i class="swatch circle" style="--c:#0f7a3d">✓</i>Available</span>
        <span><i class="swatch diamond" style="--c:#c81e1e"><b>!</b></i>Overflowing</span>
        <span><i class="swatch square" style="--c:#4b5563">✕</i>Damaged</span>
      </div>
    </details>
  </section>
</div>

<!-- Pin-drop mode: the sheet gets out of the way so the student can see the map. -->
<div class="pinbar" id="pinbar" hidden>
  <div class="small"><b>Where is a bin needed?</b><br><span class="muted">Drag the pin, or tap the map.</span></div>
  <div class="row">
    <button class="btn" id="pin-cancel">Cancel</button>
    <button class="btn primary" id="pin-confirm">Use this spot</button>
  </div>
</div>

<!-- One overlay sheet, reused by: choose report type · bin issue · bin request · confirmation -->
<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 id="modal-title">Report a problem</h2>
      <button class="x" id="modal-close" aria-label="Close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- Leaflet is served from our own site, not a CDN: ad blockers, tracking prevention
     and campus network filters all block third-party scripts, which would leave the
     page with no map at all. Leaflet 1.9.4 + leaflet.heat 0.2.0 + markercluster 1.5.3. -->
<script src="vendor/leaflet/leaflet.min.js"></script>
<script src="vendor/leaflet/leaflet.markercluster.js"></script>
<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>
